name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Lint - Fast feedback on code quality
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9 # The version should be handled by mise, but we specify it here to ensure consistency
        with:
          version: v2.12.2

  # ─────────────────────────────────────────────────────────────────────────
  # Test - Run tests across platforms and Go versions
  #
  # Support policy: opnDossier supports the current and previous stable Go
  # releases (N and N-1), matching Go's upstream release policy. The matrix
  # below exercises both `stable` and `oldstable`; mise still drives lint,
  # format, and the rest of the toolchain — `actions/setup-go` is layered on
  # top of mise here purely to override the Go toolchain for this job.
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go.mod declares go 1.26 and the codebase uses 1.26-only features
        # (reflect.Value.Fields iter.Seq2, for-range over int, etc.), so
        # `oldstable` (Go 1.25) cannot compile it. The matrix sticks to
        # `stable` until the module minimum drops back to N-1.
        go-version: [stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go (${{ matrix.go-version }})
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # Windows previously ran `just ci-smoke` (./cmd/... and ./internal/config/...
      # only) on the belief that the full suite was too slow there. It was not
      # slow, it failed: nao1215/markdown emitted CRLF against LF golden fixtures,
      # and several tests hardcoded POSIX paths. Both are fixed, and the full
      # suite measures 24s on Windows against 18s for ci-smoke.
      - name: Run tests
        run: just test

  # ─────────────────────────────────────────────────────────────────────────
  # Integration Tests - E2E testing with real config files
  # ─────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run integration tests
        run: go test -tags=integration -v -timeout 5m ./...

  # ─────────────────────────────────────────────────────────────────────────
  # Coverage - Generate and upload coverage report
  # ─────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with coverage
        run: just test-coverage

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          # Dependabot PRs run without access to CODECOV_TOKEN, so the tokenless
          # upload to a protected branch is rejected. Only enforce upload success
          # where the token is available; tests themselves still run above and
          # gate the job regardless of actor.
          fail_ci_if_error: ${{ github.actor != 'dependabot[bot]' }}

  # ─────────────────────────────────────────────────────────────────────────
  # Build - Verify builds across platforms
  # ─────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        run: just build-release

      - name: Verify binary
        run: ./opndossier --version || ./opndossier --help

      - name: Cross-compile check
        run: |
          GOOS=linux GOARCH=amd64 go build -o /dev/null main.go
          GOOS=darwin GOARCH=amd64 go build -o /dev/null main.go
          GOOS=darwin GOARCH=arm64 go build -o /dev/null main.go
          GOOS=windows GOARCH=amd64 go build -o /dev/null main.go

  # ─────────────────────────────────────────────────────────────────────────
  # SBOM Generation
  #
  # Only runs on push-to-main. Rationale:
  #   - goreleaser's release-time SBOMs (see .goreleaser.yaml `sboms:`) are
  #     the authoritative SBOMs shipped with each release artifact.
  #   - .github/workflows/sbom.yml runs on a weekly schedule to catch drift
  #     in dependency graphs between releases.
  #   - Running SBOM generation on every PR was duplicative and added ~2min
  #     of CI time per PR without surfacing new information.
  # If you need an SBOM for a PR locally, use `just sbom` or run
  # `cyclonedx-gomod` directly.
  # ─────────────────────────────────────────────────────────────────────────
  sbom:
    name: Generate SBOM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build binary
        run: just build-release

      - name: Generate SBOM from binary (CycloneDX)
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2
        with:
          version: v1.9.0
          args: bin -output sbom-binary.cyclonedx.json ./opndossier

      - name: Generate SBOM from modules (CycloneDX)
        uses: CycloneDX/gh-gomod-generate-sbom@efc74245d6802c8cefd925620515442756c70d8f # v2
        with:
          version: v1.9.0
          args: app -output sbom-modules.cyclonedx.json -json .

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-reports
          path: |
            sbom-binary.cyclonedx.json
            sbom-modules.cyclonedx.json
          retention-days: 90
